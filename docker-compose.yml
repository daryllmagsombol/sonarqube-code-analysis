services:
  sonarqube:
    image: mc1arke/sonarqube-with-community-branch-plugin:26.5.0.122743-community
    container_name: sonarqube
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://azure-vm-postgres-1:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
      SONAR_WEB_JAVA_OPTS: "-Xmx384m -Xms192m"
      SONAR_CE_JAVA_OPTS: "-Xmx384m -Xms192m"
      SONAR_SEARCH_JAVA_OPTS: "-Xmx512m -Xms256m"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 8192
        hard: 8192
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - azure-vm_default
networks:
  azure-vm_default:
    external: true
volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
